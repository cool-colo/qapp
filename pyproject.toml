[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qapp"
version = "0.1.0"
description = "China A-share daily model-prediction trading strategy (backtest + live) on Nautilus Trader"
requires-python = ">=3.12"

# NOTE: nautilus_trader is intentionally NOT listed here. It is consumed as an
# out-of-tree checkout (default /data/flc/code/quant/nautilus_trader, overridable
# via NAUTILUS_TRADER_PATH); every runnable script prepends it to sys.path rather
# than importing an installed package. Do not add it as a dependency — pip would
# try to resolve a version from PyPI that does not match the local checkout.
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
# MySQL result persistence (backtests run with --write-results, and the live daily-
# snapshot writer). Imported lazily in the result writers. pymysql is the driver;
# sqlalchemy provides the thread-safe connection pool the live writer checks out per
# operation (so a LiveClock timer thread and the node loop never share a socket).
mysql = ["pymysql", "sqlalchemy"]

# Prometheus metrics endpoint for the live node (lives/monitoring.py). Imported
# optionally — the exporter no-ops with a warning if this is absent.
monitoring = ["prometheus_client"]

# Local read-only dashboard (web/) that visualizes the live_* MySQL snapshots and
# ClickHouse bars. FastAPI JSON backend + static ECharts frontend (no build step).
# ClickHouse is reached over its HTTP interface with stdlib urllib, so no CH client
# lib is needed. pymysql reads the live_* tables; pyyaml loads web/config.yaml.
web = ["fastapi", "uvicorn[standard]", "pymysql", "pyyaml"]

# Everything optional at once, for a full deployment environment.
all = ["pymysql", "sqlalchemy", "prometheus_client", "fastapi", "uvicorn[standard]", "pyyaml"]

[tool.setuptools.packages.find]
# Scripts run as modules from the repo root
# (e.g. `python -m backtests.model_predictions.run_backtest`), so the trading
# packages and their subpackages must be importable as top-level packages. There
# is no src/ layout. logs/, output/, and monitoring/ are not import packages.
include = ["backtests*", "lives*", "strategies*", "web*"]
exclude = ["logs*", "output*", "monitoring*"]
