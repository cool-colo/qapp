# Task orchestration is mandatory. This file configures its components and tasks.
# All values below are process-local configuration.
schema_version: 2
# Nautilus timer interval; must not exceed exposure.interval_secs.
poll_interval_secs: 0.5

# Framework-owned cleanup; per-task policies below may skip selected boundaries.
# No new orders while cleaning; cancel as soon as the cancel window permits.
cleanup_component: cancel_reconcile
# Request Nautilus reconciliation during bootstrap and task-transition cleanup.
# false skips these queries only; terminal orders and a quiet state remain required.
# Does not disable the node's startup, pre-open or reference-refresh reconciliation.
cleanup_reconciliation_enabled: true

exposure_components:
  assessor: position_ratio
  planner: remaining_target
  executor: nautilus_exposure
  risk_planner: risk_manager
  validator: formal_remainder
  outcome: capacity_replan

exposure:
  # Defaults for tasks.exposure_correction; explicit task fields take precedence.
  enabled: true
  tolerance: "0.05"  # Absolute ratio difference: 0.05 = 5 percentage points, inclusive.
  windows: "09:35-11:30"
  interval_secs: 1.0
  priority: 50
  # Correction estimates use mark prices without fees and aim for zero deviation.
  quote_max_age_secs: 15.0

# Every supported per-task field is explicit below:
# enabled: accept new runs; disabling does not cancel an active run.
# priority: larger values run first; equal priorities use enqueue order.
# can_preempt: this task may preempt a lower-priority task.
# preemptible: a higher-priority task may preempt this task after cleanup.
# skip_entry_cleanup: skip cancellation, reconciliation and quiet-state waiting at admission.
# skip_exit_cleanup: skip cleanup only after normal SUCCEEDED completion.
# Both default false. Bootstrap, interruptions, expiry and requires_stable always clean.
# Entry skipping never bypasses a previous owner's unfinished exit cleanup.
# splitter: ordinary execution splitter; auction keeps its dedicated splitter.
# cancellation: execution cancellation policy, separate from task cleanup.
# Scheduled triggers use the strategy clock times; they do not poll evaluate().
# Planning tasks select their goal planner; auction_goal owns fresh-market preparation.
# Task timing still comes from strategy.yaml; correction timing uses exposure.
# Bootstrap is fixed at priority 1000 and cannot be configured here.
tasks:
  daily_planning:
    planner: risk_manager
    enabled: true
    priority: 100
    can_preempt: true
    preemptible: true
    skip_entry_cleanup: false
    skip_exit_cleanup: false
    splitter: existing_notional
    cancellation: existing

  auction_planning:
    planner: auction_goal
    enabled: true
    priority: 100
    can_preempt: true
    preemptible: true
    skip_entry_cleanup: false
    skip_exit_cleanup: false
    splitter: existing_notional
    cancellation: existing

  auction_execution:
    enabled: true
    priority: 100
    can_preempt: true
    preemptible: true
    skip_entry_cleanup: true
    skip_exit_cleanup: true  # Keep accepted auction orders working until matching.
    splitter: existing_notional
    cancellation: existing

  normal_execution:
    enabled: true
    priority: 100
    can_preempt: true
    preemptible: true
    skip_entry_cleanup: false
    skip_exit_cleanup: false
    splitter: existing_notional
    cancellation: existing

  scheduled_replan:
    planner: risk_manager
    enabled: true
    priority: 200
    can_preempt: true
    preemptible: true
    skip_entry_cleanup: false
    skip_exit_cleanup: false
    splitter: existing_notional
    cancellation: existing

  price_limit_replan:
    planner: risk_manager
    enabled: true
    priority: 200
    can_preempt: true
    preemptible: true
    skip_entry_cleanup: false
    skip_exit_cleanup: false
    splitter: existing_notional
    cancellation: existing

  exposure_correction:
    # Explicit values override exposure.enabled and exposure.priority above.
    enabled: true
    priority: 50  # Lower than normal_execution (100).
    can_preempt: false
    preemptible: true
    skip_entry_cleanup: false
    skip_exit_cleanup: false
    splitter: existing_notional
    cancellation: existing

  manual_replan:
    planner: risk_manager
    enabled: true
    priority: 500
    can_preempt: true
    preemptible: true
    skip_entry_cleanup: false
    skip_exit_cleanup: false
    splitter: existing_notional
    cancellation: existing

  manual_execution:
    enabled: true
    priority: 500
    can_preempt: true
    preemptible: true
    skip_entry_cleanup: false
    skip_exit_cleanup: false
    splitter: existing_notional
    cancellation: existing
